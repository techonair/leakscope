[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "leakscope"
version = "0.1.0"
description = "Open-source, explainable leak triage for SOC teams"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
leakscope = "leakscope.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["leakscope"]
force-include = { "policies/default.yaml" = "leakscope/policy/default.yaml" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
